
name: Generate GitHub Contribution Animation

on:
  schedule:
    - cron: "17 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: pantherliftz777
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%238B5CF6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23C4B5FD

      - name: Publish SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
